<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}숏크루 - AI 인플루언서 쇼핑 플랫폼{% endblock %}</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" type="image/png" href="/static/images/mall/logo.png">
    <script src="/static/js/tracking.js" defer></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q1X20KLYPY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-Q1X20KLYPY');
    </script>
</head>
<body{% block body_extra %}{% endblock %}>
    <div class="partner-marquee" role="region" aria-label="쿠팡 파트너스 안내">
        <div class="partner-marquee__track">
            <div class="partner-marquee__half"><span class="partner-marquee__text">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</span></div>
            <div class="partner-marquee__half" aria-hidden="true"><span class="partner-marquee__text">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</span></div>
        </div>
    </div>
    <header class="site-header">
        <div class="container site-header__inner">
            <div class="site-header__row site-header__row--brand-only">
                <a class="site-header__brand brand" href="/">
                    <img class="brand-logo" src="/static/images/mall/logo.png" alt="숏크루 로고">
                    <span>Shortcrew</span>
                </a>
            </div>
        </div>
    </header>

    <main class="page-body{% block main_extra_class %}{% endblock %}">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container site-footer__inner">
            <p class="site-footer__copyright">© <span id="site-footer-year"></span> 숏크루. All rights reserved.</p>
            <p class="site-footer__admin"><a href="/admin/dashboard" class="site-footer__dashboard" aria-label="대시보드" title="대시보드"><i class="fa-solid fa-laptop" aria-hidden="true"></i></a></p>
        </div>
    </footer>

    <script>
        (function () {
            function setFooterCopyrightYear() {
                var el = document.getElementById("site-footer-year");
                if (el) el.textContent = String(new Date().getFullYear());
            }
            setFooterCopyrightYear();
        })();
    </script>
</body>
</html>
