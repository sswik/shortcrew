{% extends "base.html" %}

{% block title %}페이지를 찾을 수 없습니다 | 숏크루{% endblock %}

{% block main_extra_class %} page-body--error{% endblock %}

{% block content %}
<section class="error-page" aria-labelledby="error-page-title">
    <p class="error-page__code" aria-hidden="true">404</p>
    <h1 id="error-page-title" class="error-page__title">페이지를 찾을 수 없습니다</h1>
    <p class="error-page__message">{{ message }}</p>
    <div class="error-page__actions">
        <a class="btn btn-primary" href="/">홈으로 가기</a>
        <a class="btn btn-outline" href="/about">숏크루 소개</a>
    </div>
</section>
{% endblock %}
