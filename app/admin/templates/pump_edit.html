{% extends "layout.html" %}

{% block title %}펌프 몰 편집 | 숏크루{% endblock %}
{% block page_heading %}펌프 몰 소개·테마 편집{% endblock %}

{% block content %}
<div class="mb-4 flex items-center justify-between">
    <p class="text-sm text-slate-600">공개 몰 <code class="rounded bg-slate-100 px-1">/{{ pump.name_slug }}</code> 소개 탭·테마에 반영됩니다. 슬러그는 변경 불가.</p>
    <a href="/{{ pump.name_slug }}" target="_blank" rel="noopener" class="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">공개 몰 보기 ↗</a>
</div>

<form method="post" action="/admin/pumps/{{ pump.name_slug }}/edit" class="max-w-2xl space-y-4 rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    <div>
        <label class="mb-1 block text-sm font-semibold text-slate-700" for="display_name">표시 이름</label>
        <input id="display_name" name="display_name" type="text" required value="{{ pump.display_name }}"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm" />
    </div>
    <div>
        <label class="mb-1 block text-sm font-semibold text-slate-700" for="profile_image">프로필 이미지 URL</label>
        <input id="profile_image" name="profile_image" type="text" value="{{ pump.profile_image }}"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm" />
    </div>
    <div>
        <label class="mb-1 block text-sm font-semibold text-slate-700" for="cover_image">커버 이미지 URL</label>
        <input id="cover_image" name="cover_image" type="text" value="{{ pump.cover_image or '' }}"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm" />
    </div>
    <div>
        <label class="mb-1 block text-sm font-semibold text-slate-700" for="bio">소개 (홈·채널소개)</label>
        <textarea id="bio" name="bio" rows="4" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">{{ pump.bio or '' }}</textarea>
    </div>
    <div>
        <label class="mb-1 block text-sm font-semibold text-slate-700" for="mall_theme_json">몰 테마 JSON (HEX)</label>
        <textarea id="mall_theme_json" name="mall_theme_json" rows="6" class="w-full rounded-md border border-slate-300 px-3 py-2 font-mono text-xs"
                  placeholder='{"background":"#0f172a","card":"#0f172a","accent":"#7c3aed","warning":"#f97316","textMain":"#f8fafc","textSub":"#94a3b8","border":"#1e293b"}'>{{ mall_theme_json_text }}</textarea>
        <p class="mt-1 text-xs text-slate-500">비우면 기본 다크 팔레트. HEX(#RRGGBB) 키만 반영됩니다.</p>
    </div>
    <div>
        <label class="mb-1 block text-sm font-semibold text-slate-700" for="youtube_url">유튜브 URL</label>
        <input id="youtube_url" name="youtube_url" type="url" value="{{ pump.youtube_url or '' }}"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm" placeholder="https://www.youtube.com/..." />
    </div>
    <div>
        <label class="mb-1 block text-sm font-semibold text-slate-700" for="instagram_url">인스타그램 URL</label>
        <input id="instagram_url" name="instagram_url" type="url" value="{{ pump.instagram_url or '' }}"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm" placeholder="https://www.instagram.com/..." />
    </div>
    <div>
        <label class="mb-1 block text-sm font-semibold text-slate-700" for="tiktok_url">틱톡 URL</label>
        <input id="tiktok_url" name="tiktok_url" type="url" value="{{ pump.tiktok_url or '' }}"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm" placeholder="https://www.tiktok.com/..." />
    </div>
    <div class="flex gap-3 pt-2">
        <button type="submit" class="rounded-md bg-primary px-4 py-2 text-sm font-semibold text-white hover:bg-primary-600">저장</button>
        <a href="/admin/pumps" class="rounded-md border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">취소</a>
    </div>
</form>
{% endblock %}
